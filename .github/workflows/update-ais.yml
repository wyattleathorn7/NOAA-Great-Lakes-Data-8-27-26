name: Update AIS vessel positions

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ais
  cancel-in-progress: true

jobs:
  update-ais:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch AISHub batch and update KML/KMZ
        env:
          AISHUB_USERNAME: ${{ secrets.AISHUB_USERNAME }}
        run: |
          python3 ais/aishub_fetch.py --live || python3 ais/aishub_fetch.py --mock
          python3 ais/update_ais.py
          # Rebuild KMZ from updated KML + red icon (exact PNG)
          python3 -c "import zipfile; z=zipfile.ZipFile('ais/great_lakes_ais.kmz','w',zipfile.ZIP_DEFLATED); z.write('ais/great_lakes_ais.kml','great_lakes_ais.kml'); z.write('ais/icons/Copilot_20260827_201004.png','icons/Copilot_20260827_201004.png'); z.close(); print('KMZ rebuilt')"
          echo "Updated AIS KML/KMZ at $(date -u)"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ais/great_lakes_ais.kml ais/great_lakes_ais.kmz
          if git diff --cached --quiet; then
            echo "No AIS changes to commit"
            exit 0
          fi
          git commit -m "Update AIS vessel positions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

name: Publish live buoys KML

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs slightly.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed by peaceiris/actions-gh-pages to push gh-pages

concurrency:
  group: publish-live-buoys
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate live KML
        env:
          KML_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: python3 generate_live_kml.py --force

      - name: Deploy to GitHub Pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          rm -rf /tmp/pages-deploy
          mkdir -p /tmp/pages-deploy
          cp -r docs/. /tmp/pages-deploy/
          cd /tmp/pages-deploy
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy live buoys KML"
          git push --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:gh-pages
